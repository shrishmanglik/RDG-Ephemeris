# Hosted Actions are disabled on the repository; these jobs are run locally by
# the maintainers' CI runner. The file defines the gate either way.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .[test]
      - name: Provision declared DE440 input
        run: ephemeris-oss kernels fetch --verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provision Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Build declared native and browser inputs
        run: python tools/build_rust_inputs.py
      - name: Rust tests
        run: cargo test --manifest-path rust/ephemeris-core/Cargo.toml
      - name: Run tests
        run: pytest -q

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Provenance checker self-test
        run: python tools/check_provenance.py --self-test
      - name: Provenance check on src
        run: python tools/check_provenance.py src --allow tools/provenance-allow.txt

  internal-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Internal-id checker self-test
        run: python tools/check_internal_ids.py --self-test
      - name: Internal-id check on src and tests
        run: python tools/check_internal_ids.py src tests

  import-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .[test]
      - name: Import graph test
        run: pytest -q tests/test_import_graph.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tool
        run: pip install build
      - name: Build source and wheel distributions
        run: python -m build
      - name: Distribution boundary controls
        run: python tools/check_wheel.py --self-test
      - name: Inspect built wheel
        run: python tools/check_wheel.py dist/*.whl
      - name: Inspect both release archives
        run: python tools/verify_release.py dist/*.whl dist/*.tar.gz
