[package]
name = "ephemeris-core"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Clean-room Chebyshev polynomial evaluator, relativistic time scales, ayanamsa, and Vedic Shodashvarga engine for native and WebAssembly targets."

[lib]
name = "ephemeris_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["long-term"]
long-term = ["dep:sofars"]
spk-reader = ["long-term"]

[dependencies]
sofars = { version = "=0.6.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
