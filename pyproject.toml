[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeris-oss"
description = "Planetary positions from JPL kernels, with explicit conventions and calculation receipts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The AGI Studio" }]
dependencies = ["numpy>=1.26", "pyerfa>=2.0.1", "jplephem>=2.21", "tzdata>=2024.1"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
test = ["pytest>=8", "skyfield==1.55"]

[project.scripts]
ephemeris-oss = "ephemeris_oss.cli:main"
rdg-ephemeris = "ephemeris_oss.cli:main"
rdg-ephemeris-mcp = "ephemeris_oss.mcp_server:main"
rdg-ephemeris-api = "ephemeris_oss.api_server:main"

[tool.setuptools.dynamic]
version = { attr = "ephemeris_oss._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ephemeris_oss = ["data/*.zlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
